- title: Summary
  type: list
  contents:
    - <b>Emmy Noether research group leader</b> at the Institute for Theoretical Physics, Heidelberg University, and <b>project leader</b> in the Collaborative Research Center ISOQUANT.
    - "<b>Interests:</b> QCD thermalisation, kinetic theory and attractors; collectivity in small and large collision systems; jet quenching and hard probes in the quark-gluon plasma; chiral phase transition and non-equilibrium dynamics of ultracold quantum gases."
    - "<b>Accumulated third party funding:</b> €2.5 million in research grants, plus workshop and programme funding."
    - "<b>Teaching and supervision:</b> master level courses and invited lecture series; 3 postdocs, 3 PhD students, 3 master and 2 bachelor students supervised to date."

